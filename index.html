<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Multiplayer Clock</title>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <section class="screen on" id="s1">
      <header>
        <h1>New game</h1>
        <div class="seg themesel">
          <button data-th="light">Light</button><button data-th="dark">Dark</button>
        </div>
      </header>
      <label class="field" style="margin-bottom: 12px">Game name
        <div>
          <input
            id="gameName"
            maxlength="40"
            placeholder="e.g. Catan night" />
        </div>
      </label>
      <h2 style="margin-top: 4px">Players</h2>
      <div id="list"></div>
      <button id="add">+ Add player</button>
      <div id="histWrap" style="display: none">
        <h2>Past games</h2>
        <div id="history"></div>
      </div>
      <div class="spacer"></div>
      <div class="foot">
        <button class="primary" id="next1">Next: time controls</button>
      </div>
    </section>

    <section class="screen" id="s2">
      <header>
        <h1>Time control</h1>
        <div class="seg themesel">
          <button data-th="light">Light</button><button data-th="dark">Dark</button>
        </div>
      </header>
      <h2>Quick picks</h2>
      <div class="grid" id="quick"></div>
      <h2>More options</h2>
      <button id="moreBtn" style="width: 100%">More options ▾</button>
      <div class="grid" id="more" style="display: none; margin-top: 8px"></div>
      <div id="customWrap" style="display: none">
        <h2>Custom control</h2>
        <div class="fields">
          <label class="field">Time limit
            <div>
              <input
                id="cMin"
                type="number"
                inputmode="numeric"
                min="0"
                max="999"
                value="5" /><span>min</span>
            </div>
          </label>
          <label class="field">
            Added per turn
            <div>
              <input
                id="cInc"
                type="number"
                inputmode="numeric"
                min="0"
                max="999"
                value="5" /><span>sec</span>
            </div>
          </label>
        </div>
      </div>
      <div id="selInfo"></div>
      <div class="spacer"></div>
      <div class="foot">
        <button id="back2">Back</button><button class="primary" id="start">Start game</button>
      </div>
    </section>

    <section id="play">
      <div class="zone top" id="zTop" role="button" tabindex="0">
        <span class="n"></span><span class="t"></span>
      </div>
      <div class="mid">
        <div class="strip" id="strip"></div>
        <div class="btns">
          <button id="pauseBtn">⏸ Pause</button><button id="setBtn">⚙ Settings</button>
        </div>
      </div>
      <div class="zone bottom" id="zBot" role="button" tabindex="0">
        <span class="n"></span><span class="t"></span>
      </div>
    </section>

    <div class="modal" id="modal">
      <div class="sheet">
        <header>
          <h1>Settings</h1>
          <button id="closeSet" class="primary">Resume</button>
        </header>
        <h2>Theme</h2>
        <div class="seg themesel">
          <button data-th="light">Light</button><button data-th="dark">Dark</button>
        </div>
        <h2>Adjust time</h2>
        <div id="adjust"></div>
        <h2>Game</h2>
        <div class="foot" style="margin-top: 0">
          <button id="restart" style="flex: 1">Restart</button><button id="end" class="danger" style="flex: 1">End Game</button>
        </div>
      </div>
    </div>

    <div
      class="modal"
      id="confirm"
      style="z-index: 20; align-items: center; padding: 16px">
      <div
        class="sheet"
        style="border-radius: 18px; max-width: 380px; text-align: center">
        <p id="cMsg"></p>
        <div class="foot">
          <button id="cNo">Cancel</button><button class="primary" id="cYes">Confirm</button>
        </div>
      </div>
    </div>
    <div
      class="modal"
      id="summary"
      style="z-index: 15; align-items: center; padding: 16px">
      <div class="sheet" style="border-radius: 18px; max-width: 420px">
        <header><h1>Game summary</h1></header>
        <div id="sumBody"></div>
        <div class="foot">
          <button class="primary" id="sumDone">Done</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@shopify/draggable@1.1.3/build/umd/index.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
