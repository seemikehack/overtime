<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiplayer Clock</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#d9dde3;--accent:#2563eb;--onaccent:#fff;--idle:#e6e9ee;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#181c23;--text:#eef0f3;--muted:#98a1ae;--line:#2a303a;--accent:#5b8def;--onaccent:#0b1020;--idle:#1d222b;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#181c23;--text:#eef0f3;--muted:#98a1ae;--line:#2a303a;--accent:#5b8def;--onaccent:#0b1020;--idle:#1d222b;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
.screen{display:none;height:100%;flex-direction:column;max-width:560px;margin:0 auto;padding:16px;overflow-y:auto}
.screen.on{display:flex}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
h1{font-size:22px;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
button:disabled{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;background:var(--card)}
.seg button.sel{background:var(--accent);color:var(--onaccent);box-shadow:none}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 4px}
.row.drag{opacity:.8;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.handle{touch-action:none;border:0;background:none;color:var(--muted);font-size:20px;padding:8px 10px;cursor:grab}
.row input{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--text);background:none;border:0;outline:0;padding:8px 4px}
.row .x{border:0;background:none;color:var(--muted);font-size:20px;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{font-size:18px;font-weight:600;padding:16px 8px}
.grid button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.fields{display:flex;gap:12px}
.field{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field div{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.field input{flex:1;min-width:0;font:inherit;font-size:20px;color:var(--text);background:none;border:0;outline:0;padding:10px 0}
.field span{font-weight:600}
.spacer{flex:1;min-height:12px}
.foot{display:flex;gap:8px;margin-top:16px}.foot .primary{flex:1}
/* play */
#play{padding:0;max-width:none;overflow:hidden;display:none}
#play.on{display:grid;grid-template-rows:1fr auto 1fr}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;border:0;border-radius:0;background:var(--accent);color:var(--onaccent);padding:12px}
.zone.top{transform:rotate(180deg)}
.zone .n{font-size:clamp(22px,7vw,40px);font-weight:700;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone .t{font-size:clamp(56px,22vw,120px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.zone.over{background:var(--bad);color:#fff}
.zone.flash{animation:fl .5s 4}
.zone.paused{filter:saturate(.3) brightness(.85)}
@keyframes fl{50%{background:#fff;color:#000}}
.mid{background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:1 0 22%;background:var(--idle);border-radius:10px;padding:4px 6px;text-align:center;font-size:12px;border:2px solid transparent;min-width:0}
.chip b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.act{border-color:var(--accent)}.chip.over{color:var(--bad)}
.chip span{font-variant-numeric:tabular-nums;color:var(--muted)}
.btns{display:flex;gap:10px;justify-content:center}.btns button{flex:1;max-width:180px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.adj{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.adj .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adj .tm{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.adj button{padding:6px 8px;min-height:38px;font-size:13px}
.danger{color:var(--bad)}
</style>
</head>
<body>

<section class="screen on" id="s1">
  <header><h1>Players</h1><div class="seg themesel"><button data-th="light">Light</button><button data-th="dark">Dark</button></div></header>
  <div id="list"></div>
  <button id="add">+ Add player</button>
  <div class="spacer"></div>
  <div class="foot"><button class="primary" id="next1">Next: time controls</button></div>
</section>

<section class="screen" id="s2">
  <header><h1>Time control</h1><div class="seg themesel"><button data-th="light">Light</button><button data-th="dark">Dark</button></div></header>
  <h2>Quick picks</h2><div class="grid" id="quick"></div>
  <h2>More options</h2>
  <button id="moreBtn" style="width:100%">More options ▾</button>
  <div class="grid" id="more" style="display:none;margin-top:8px"></div>
  <h2>Custom control</h2>
  <div class="fields">
    <label class="field">Time limit<div><input id="cMin" type="number" inputmode="numeric" min="0" max="999" value="15"><span>min</span></div></label>
    <label class="field">Added per turn<div><input id="cInc" type="number" inputmode="numeric" min="0" max="999" value="0"><span>sec</span></div></label>
  </div>
  <div class="spacer"></div>
  <div class="foot"><button id="back2">Back</button><button class="primary" id="start">Start game</button></div>
</section>

<section id="play">
  <button class="zone top" id="zTop"><span class="n"></span><span class="t"></span></button>
  <div class="mid"><div class="strip" id="strip"></div>
    <div class="btns"><button id="pauseBtn">⏸ Pause</button><button id="setBtn">⚙ Settings</button></div></div>
  <button class="zone" id="zBot"><span class="n"></span><span class="t"></span></button>
</section>

<div class="modal" id="modal"><div class="sheet">
  <header><h1>Settings</h1><button id="closeSet" class="primary">Resume</button></header>
  <h2>Theme</h2><div class="seg themesel"><button data-th="light">Light</button><button data-th="dark">Dark</button></div>
  <h2>Adjust time</h2><div id="adjust"></div>
  <h2>Game</h2>
  <div class="foot" style="margin-top:0"><button id="restart" style="flex:1">Restart</button><button id="quit" class="danger" style="flex:1">Quit</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let theme=null,uid=0;
try{theme=localStorage.getItem('mpc-theme')}catch(e){}
function applyTheme(){
  if(theme)document.documentElement.setAttribute('data-theme',theme);else document.documentElement.removeAttribute('data-theme');
  const eff=theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  $$('.themesel button').forEach(b=>b.classList.toggle('sel',b.dataset.th===eff));
}
$$('.themesel button').forEach(b=>b.onclick=()=>{theme=b.dataset.th;try{localStorage.setItem('mpc-theme',theme)}catch(e){}applyTheme()});
applyTheme();

function show(id){$$('.screen,#play').forEach(e=>e.classList.remove('on'));$('#'+id).classList.add('on')}

/* ---- Players list ---- */
let players=[{id:++uid,name:''},{id:++uid,name:''}];
function renderList(){
  const l=$('#list');l.innerHTML='';
  players.forEach((p,i)=>{
    const r=document.createElement('div');r.className='row';r.dataset.id=p.id;
    r.innerHTML=`<button class="handle" aria-label="Drag to reorder">⠿</button><input maxlength="20" placeholder="Player ${i+1}" value="">${players.length>2?'<button class="x" aria-label="Remove">✕</button>':''}`;
    const inp=r.querySelector('input');inp.value=p.name;inp.oninput=()=>p.name=inp.value;
    const x=r.querySelector('.x');if(x)x.onclick=()=>{players=players.filter(q=>q!==p);renderList()};
    const h=r.querySelector('.handle');
    h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);r.classList.add('drag')};
    h.onpointermove=e=>{
      if(!r.classList.contains('drag'))return;
      const t=document.elementFromPoint(window.innerWidth/2,e.clientY);
      const o=t&&t.closest&&t.closest('.row');
      if(o&&o!==r&&o.parentNode===l){
        const rr=o.getBoundingClientRect(),after=e.clientY>rr.top+rr.height/2;
        const before=[...l.children].indexOf(r)<[...l.children].indexOf(o);
        if(before&&after)o.after(r);else if(!before&&!after)o.before(r);
      }
    };
    const end=()=>{if(!r.classList.contains('drag'))return;r.classList.remove('drag');
      const order=[...l.children].map(c=>+c.dataset.id);players.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));renderList()};
    h.onpointerup=end;h.onpointercancel=end;
    l.appendChild(r);
  });
  $('#add').style.display=players.length>=8?'none':'';
}
$('#add').onclick=()=>{if(players.length<8){players.push({id:++uid,name:''});renderList()}};
renderList();
$('#next1').onclick=()=>show('s2');
$('#back2').onclick=()=>show('s1');

/* ---- Time controls ---- */
let ctl={m:5,i:5};
const quick=[[3,2],[5,5],[10,0]],more=[[1,0],[2,1],[3,0],[5,0],[15,10],[15,0],[20,10],[30,0],[30,20],[60,0],[90,30],[120,0]];
function fill(el,arr){arr.forEach(([m,i])=>{const b=document.createElement('button');b.dataset.m=m;b.dataset.i=i;b.innerHTML=`${m}+${i}<small>${m} min + ${i} sec</small>`;b.onclick=()=>{ctl={m,i};$('#cMin').value=m;$('#cInc').value=i;mark()};el.appendChild(b)})}
fill($('#quick'),quick);fill($('#more'),more);
function mark(){$$('#quick button,#more button').forEach(b=>b.classList.toggle('sel',+b.dataset.m===ctl.m&&+b.dataset.i===ctl.i))}
$('#moreBtn').onclick=()=>{const m=$('#more'),o=m.style.display==='none';m.style.display=o?'grid':'none';$('#moreBtn').textContent='More options '+(o?'▴':'▾')};
function readCustom(){
  const m=Math.max(0,Math.min(999,parseFloat($('#cMin').value)||0)),i=Math.max(0,Math.min(999,parseInt($('#cInc').value)||0));
  ctl={m,i};mark();
}
$('#cMin').oninput=$('#cInc').oninput=readCustom;
mark();

/* ---- Game ---- */
let G=null,timer=null,wake=null;
const fmt=ms=>{
  const over=ms<0,a=Math.abs(ms);let s=over?Math.floor(a/1000):Math.ceil(a/1000);
  let str;
  if(!over&&a<10000)str='0:0'+(a/1000).toFixed(1);
  else{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
    str=(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0')}
  return over?'+'+str:str;
};
const nm=(p,i)=>p.name.trim()||'Player '+(i+1);
$('#start').onclick=()=>{
  readCustom();
  if(ctl.m<=0&&ctl.i<=0){alert('Set a time limit or an increment.');return}
  G={ps:players.map((p,i)=>({name:nm(p,i),ms:ctl.m*60000,warned:false})),cur:0,run:true,inc:ctl.i,last:performance.now()};
  show('play');render();
  clearInterval(timer);timer=setInterval(tick,100);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
};
function tick(){
  if(!G||!G.run)return;
  const now=performance.now(),p=G.ps[G.cur];p.ms-=now-G.last;G.last=now;
  if(p.ms<0&&!p.warned){p.warned=true;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
    [$('#zTop'),$('#zBot')].forEach(z=>{z.classList.remove('flash');void z.offsetWidth;z.classList.add('flash')})}
  render();
}
function render(){
  if(!G)return;
  const p=G.ps[G.cur];
  [$('#zTop'),$('#zBot')].forEach(z=>{
    z.querySelector('.n').textContent=p.name;z.querySelector('.t').textContent=fmt(p.ms);
    z.classList.toggle('over',p.ms<0);z.classList.toggle('paused',!G.run);
  });
  $('#strip').innerHTML=G.ps.map((q,i)=>`<div class="chip${i===G.cur?' act':''}${q.ms<0?' over':''}"><b></b><span>${fmt(q.ms)}</span></div>`).join('');
  $$('#strip .chip b').forEach((b,i)=>b.textContent=G.ps[i].name);
  $('#pauseBtn').textContent=G.run?'⏸ Pause':'▶ Resume';
}
function advance(){
  if(!G||!G.run)return;
  tick();const p=G.ps[G.cur];
  p.ms+=G.inc*1000;if(p.ms>=0)p.warned=false;
  G.cur=(G.cur+1)%G.ps.length;
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  render();
}
$('#zTop').onclick=$('#zBot').onclick=advance;
function setRun(r){if(!G)return;if(G.run)tick();G.run=r;G.last=performance.now();render()}
$('#pauseBtn').onclick=()=>setRun(!G.run);

/* ---- Settings ---- */
let wasRunning=false;
function renderAdjust(){
  const a=$('#adjust');a.innerHTML='';
  G.ps.forEach((p,i)=>{
    const d=document.createElement('div');d.className='adj';
    d.innerHTML='<span class="nm"></span><span class="tm"></span>'+[['−1m',-60],['−10s',-10],['+10s',10],['+1m',60]].map(([l,s])=>`<button data-s="${s}">${l}</button>`).join('');
    d.querySelector('.nm').textContent=p.name;d.querySelector('.tm').textContent=fmt(p.ms);
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{p.ms+=(+b.dataset.s)*1000;p.warned=p.ms<0;render();renderAdjust()});
    a.appendChild(d);
  });
}
$('#setBtn').onclick=()=>{wasRunning=G.run;setRun(false);renderAdjust();applyTheme();$('#modal').classList.add('on')};
$('#closeSet').onclick=()=>{$('#modal').classList.remove('on');if(wasRunning)setRun(true)};
$('#restart').onclick=()=>{if(!confirm('Restart the game with fresh clocks?'))return;
  G.ps.forEach(p=>{p.ms=ctl.m*60000;p.warned=false});G.cur=0;G.last=performance.now();wasRunning=true;renderAdjust();render()};
$('#quit').onclick=()=>{if(!confirm('Quit this game and return to setup?'))return;
  clearInterval(timer);G=null;try{wake&&wake.release()}catch(e){}
  $('#modal').classList.remove('on');show('s1')};
</script>
</body>
</html>
